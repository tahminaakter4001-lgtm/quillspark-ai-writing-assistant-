name: quillspark-sandbox

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in runtime.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in runtime.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in runtime.env}
    volumes:
      - quillspark_sandbox_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: quillspark-api:sandbox
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      QUILLSPARK_API_TOKEN: ${QUILLSPARK_API_TOKEN:?Set QUILLSPARK_API_TOKEN in runtime.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in runtime.env}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in runtime.env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in runtime.env}
      DATABASE_SSL: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend

volumes:
  quillspark_sandbox_db:

networks:
  backend:
    internal: true
