name: QuillSpark Bengali Terminology Audit

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.docx"
      - "glossary/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terminology-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.docx"
      - "glossary/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/terminology-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminology-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Test and run terminology audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements-audit.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic Bengali terminology audit
        run: >-
          python scripts/terminology_audit.py
          --input docs
          --glossary glossary/bn-it-glossary.json
          --include-draft
          --output audit-reports/terminology-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quillspark-bengali-terminology-audit
          path: audit-reports/terminology-audit.json
          if-no-files-found: warn
          retention-days: 14
