name: Validate software development glossary

on:
  push:
    paths:
      - "glossary/software-development-candidates.*"
      - "scripts/validate_software_glossary.py"
      - ".github/workflows/validate-software-glossary.yml"
  pull_request:
    paths:
      - "glossary/software-development-candidates.*"
      - "scripts/validate_software_glossary.py"
      - ".github/workflows/validate-software-glossary.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Validate glossary
        run: python scripts/validate_software_glossary.py
