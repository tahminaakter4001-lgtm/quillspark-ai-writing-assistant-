name: QuillSpark Sandbox Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quillspark-sandbox-image
  cancel-in-progress: false

jobs:
  test-and-publish:
    name: Test backend and publish sandbox container
    runs-on: ubuntu-latest
    environment: sandbox
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quillspark_test
          POSTGRES_USER: quillspark
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quillspark -d quillspark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run backend test suite
        working-directory: backend
        env:
          NODE_ENV: test
          QUILLSPARK_API_TOKEN: test-only-token-with-at-least-32-characters
          DATABASE_URL: postgresql://quillspark:test-only-password@localhost:5432/quillspark_test
          DATABASE_SSL: "false"
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quillspark-api:sandbox-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
