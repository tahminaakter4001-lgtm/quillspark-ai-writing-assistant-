name: QuillSpark CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quillspark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, security and deployment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repository does not yet contain package-lock.json, so use npm install.
      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check deployment artifacts
        run: |
          test -s dist/index.html
          test -f server/index.js
          echo "Deployment readiness checks passed."
