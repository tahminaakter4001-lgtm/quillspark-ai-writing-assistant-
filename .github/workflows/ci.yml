name: QuillSpark CI

on:
  push:
    branches:
      - main
      - feature/bkash-payment-sandbox
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quillspark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        run: npm test
